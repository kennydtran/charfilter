<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Filter - Remove Unwanted Characters</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Text Filter</h1>
            <p class="subtitle">Remove unwanted characters from your text</p>
        </header>

        <div class="vimeo-section">
            <h3>🎬 VTT Caption Detector</h3>
            <div class="extension-status" id="extensionStatus">
                <p style="color: #f44336; font-size: 0.95em;">
                    ⚠️ Chrome Extension not detected. <a href="#" id="installHelp" style="color: #2196F3;">Install it here</a>
                </p>
            </div>
            <div id="vttDetector" style="margin-top: 15px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <p style="color: #555; font-size: 0.9em; margin: 0;">
                        <strong>Detected VTT Files:</strong> <span id="vttCount">0</span>
                    </p>
                    <button id="clearVttBtn" class="clear-vtt-btn" style="display: none;">Clear All</button>
                </div>
                <div id="vttList" class="vtt-list"></div>
                <p id="vttEmptyMessage" style="color: #999; text-align: center; padding: 20px; display: none;">
                    Play a video with captions on any tab.<br>VTT files will appear here automatically!
                </p>
            </div>
        </div>

        <div class="filter-options">
            <h3>Select what to remove:</h3>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="removeNumbers" checked>
                    <span>Numbers (0-9)</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="removeHyphens" checked>
                    <span>Hyphens (-)</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="removeColons" checked>
                    <span>Colons (:)</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="removeGreaterThan" checked>
                    <span>Greater Than (&gt;)</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="removeLessThan" checked>
                    <span>Less Than (&lt;)</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="removeSlashes" checked>
                    <span>Forward Slashes (/)</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="removePeriodsNextToNumbers" checked>
                    <span>Periods Next to Numbers</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="keepSpaces" checked>
                    <span>Keep Spaces</span>
                </label>
            </div>
        </div>

        <div class="text-section">
            <label for="inputText">Input Text:</label>
            <textarea 
                id="inputText" 
                placeholder="Paste your text here or use the Vimeo import above..."
                rows="10"
            ></textarea>
        </div>

        <button id="generateBtn" class="generate-btn">Generate Filtered Text</button>

        <div class="text-section">
            <label for="outputText">Filtered Output:</label>
            <textarea 
                id="outputText" 
                placeholder="Your filtered text will appear here..."
                rows="10"
                readonly
            ></textarea>
        </div>

        <div class="action-buttons">
            <button id="copyBtn" class="action-btn">Copy to Clipboard</button>
            <button id="clearBtn" class="action-btn secondary">Clear All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
